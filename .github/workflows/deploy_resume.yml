name: Publish Resume
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy_lxc139:
    name: LXC 139 sync (LAN timer — no WAN SSH)
    runs-on: ubuntu-latest
    steps:
      - name: Record push for resume-site-git-sync on LXC 139
        run: |
          echo "GitHub push recorded."
          echo "Live site sync: LXC 139 runs resume-site-git-sync.timer every minute"
          echo "(git fetch + reset --hard origin/main in /var/www/resume.daniit-software.by)."
          echo "Hoster.by resume.даниит.com retired 25 Jul 2026 — FTP deploy removed."
